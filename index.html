<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Workout Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --card: #1c1c1c;
    --border: #252525;
    --accent: #e8f542;
    --accent2: #42c8f5;
    --red: #f55442;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  .top-nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-nav h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.06em; color: var(--accent); }
  .top-nav .date { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.65rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 10px 4px 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: color 0.2s;
  }
  .tab-btn .icon { font-size: 1.2rem; }
  .tab-btn.active { color: var(--accent); }

  .screen { display: none; padding: 16px 16px 0; }
  .screen.active { display: block; }

  .day-selector {
    display: flex; gap: 8px; margin-bottom: 10px;
    overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
  }
  .day-selector::-webkit-scrollbar { display: none; }
  .day-pill {
    flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 100px; padding: 8px 18px;
    font-size: 0.8rem; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .day-pill.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

  .day-full { font-size: 0.78rem; color: var(--muted); margin: 0 2px 18px; letter-spacing: 0.02em; }

  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }

  .ex-card-header {
    padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .ex-card-name { font-weight: 600; font-size: 0.92rem; }
  .ex-card-type { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .ex-target { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-align: right; white-space: nowrap; margin-left: 8px; }

  /* Variation dropdown */
  .variation-wrap { padding: 10px 16px 4px; position: relative; }
  .variation-select {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 600; padding: 10px 34px 10px 12px;
    cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .variation-select:focus { outline: none; border-color: var(--accent); }
  .variation-wrap::after {
    content: '▾'; position: absolute; right: 28px; top: 50%; transform: translateY(-30%);
    color: var(--accent); font-size: 0.9rem; pointer-events: none;
  }

  /* Equipment toggle (legacy — retained for old-program history edits) */
  .equip-toggle { display: flex; gap: 0; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .equip-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem; font-weight: 500; padding: 6px 8px;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .equip-btn.active { background: var(--card); color: var(--text); border: 2px solid var(--accent); }

  /* Suggestion / hint bar */
  .suggestion-bar {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .suggestion-text { font-size: 0.78rem; color: var(--accent2); font-weight: 400; }
  .suggestion-text span { font-weight: 600; color: var(--accent); }

  /* Plate calculator */
  .plate-calc {
    padding: 8px 16px 10px; border-bottom: 1px solid var(--border);
    background: #111;
  }
  .plate-calc-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .plate-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .plate-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px;
    font-size: 0.78rem; font-weight: 600; color: var(--text);
  }
  .plate-chip.p45 { border-color: #f55442; color: #f55442; }
  .plate-chip.p35 { border-color: #f5a342; color: #f5a342; }
  .plate-chip.p25 { border-color: #42c8f5; color: #42c8f5; }
  .plate-chip.p10 { border-color: #a3f542; color: #a3f542; }
  .plate-chip.p5  { border-color: #e8f542; color: #e8f542; }
  .plate-chip.p2h { border-color: #888; color: #aaa; }
  .plate-none { font-size: 0.78rem; color: var(--muted); font-style: italic; }

  .last-session {
    padding: 6px 16px 4px; font-size: 0.72rem;
    color: var(--muted); font-weight: 300; font-style: italic;
    border-bottom: 1px solid var(--border);
  }

  .set-rows { padding: 8px 16px 4px; }
  .set-row {
    display: grid; grid-template-columns: 28px 1fr 1fr auto;
    gap: 8px; align-items: center; padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-row:last-child { border-bottom: none; }
  .set-num { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--muted); text-align: center; }
  .set-input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 500; padding: 8px 10px;
    width: 100%; text-align: center; -webkit-appearance: none; transition: border-color 0.15s;
  }
  .set-input:focus { outline: none; border-color: var(--accent); }
  .set-input::placeholder { color: var(--muted2); font-weight: 300; }
  .set-labels { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 8px; padding: 6px 0 2px; }
  .set-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; }
  .set-check {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid #555;
    background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; transition: all 0.2s; flex-shrink: 0; color: #555;
  }
  .set-check:active { border-color: var(--accent); }
  .set-check.done { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  .add-set-btn {
    width: 100%; background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 10px; cursor: pointer;
    border-top: 1px solid var(--border); transition: color 0.2s;
  }
  .add-set-btn:active { color: var(--accent); }

  .notes-area {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 300; padding: 10px 12px;
    resize: none; height: 64px; margin: 8px 16px; width: calc(100% - 32px);
  }
  .notes-area:focus { outline: none; border-color: var(--accent2); }
  .notes-area::placeholder { color: var(--muted2); }

  .save-btn {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 448px;
    background: var(--accent); color: #000;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.08em;
    border: none; border-radius: 12px; padding: 16px; cursor: pointer; z-index: 150;
    transition: opacity 0.2s;
  }
  .save-btn:active { opacity: 0.8; }
  .save-btn:disabled { opacity: 0.5; }

  /* History */
  .history-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .history-tab {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; text-align: center;
    font-size: 0.75rem; font-weight: 500; color: var(--muted);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; transition: all 0.2s;
  }
  .history-tab.active { border-color: var(--accent); color: var(--accent); }

  .history-panel { display: none; }
  .history-panel.active { display: block; }

  .history-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.88rem; font-weight: 300; }
  .history-empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

  .history-entry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .history-entry-header {
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; border-bottom: 1px solid transparent; transition: border-color 0.2s;
  }
  .history-entry-header.open { border-bottom-color: var(--border); }
  .history-date { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.05em; }
  .history-day-badge { font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.06em; }
  .badge-a { background: #2a1f00; color: var(--accent); border: 1px solid var(--accent); }
  .badge-b { background: #001f2a; color: var(--accent2); border: 1px solid var(--accent2); }
  .badge-c { background: #2a0000; color: var(--red); border: 1px solid var(--red); }
  .badge-d { background: #0a1f0a; color: #42f57e; border: 1px solid #42f57e; }
  .history-body { display: none; padding: 12px 16px; }
  .history-body.open { display: block; }
  .history-ex { margin-bottom: 12px; }
  .history-ex-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
  .history-ex-slot { color: var(--muted); font-size: 0.7rem; font-weight: 400; }
  .history-sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-set-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; color: #c0c0c0; }
  .history-set-chip.done { border-color: var(--accent); color: var(--accent); }
  .history-note { font-size: 0.8rem; color: var(--muted); font-style: italic; font-weight: 300; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .history-actions { display: flex; gap: 8px; margin-top: 10px; }
  .delete-btn, .edit-btn {
    background: none; border-radius: 6px; font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem; padding: 6px 12px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .delete-btn { border: 1px solid var(--muted2); color: var(--muted); }
  .delete-btn:active { border-color: var(--red); color: var(--red); }
  .edit-btn { border: 1px solid var(--accent); color: var(--accent); font-weight: 500; }
  .edit-btn:active { background: #2a2a00; }

  /* Progress charts */
  .progress-lift-selector {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
  }
  .lift-pill {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 14px;
    font-size: 0.75rem; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .lift-pill.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .chart-container {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .chart-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 12px; }
  .chart-empty { text-align: center; padding: 30px; color: var(--muted); font-size: 0.82rem; }

  .toast {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--accent); color: #000;
    font-weight: 600; font-size: 0.82rem; letter-spacing: 0.04em;
    padding: 10px 20px; border-radius: 100px;
    opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="top-nav">
  <h1>Workout Log</h1>
  <div class="date" id="todayDate"></div>
</div>

<div class="toast" id="toast"></div>

<!-- LOG SCREEN -->
<div class="screen active" id="screen-log">
  <div class="day-selector" id="daySelector">
    <div class="day-pill active" onclick="selectDay('MEU')" id="pill-MEU">ME Upper</div>
    <div class="day-pill" onclick="selectDay('DEL')" id="pill-DEL">DE Lower</div>
    <div class="day-pill" onclick="selectDay('RU')" id="pill-RU">Rep Upper</div>
    <div class="day-pill" onclick="selectDay('MEL')" id="pill-MEL">ME Lower</div>
  </div>
  <div class="day-full" id="dayFull"></div>
  <div id="exerciseArea"></div>
</div>

<!-- HISTORY SCREEN -->
<div class="screen" id="screen-history">
  <div class="history-tabs">
    <div class="history-tab active" onclick="switchHistoryTab('log')">Session Log</div>
    <div class="history-tab" onclick="switchHistoryTab('progress')">Progress</div>
  </div>
  <div class="history-panel active" id="panel-log">
    <div id="historyList"></div>
  </div>
  <div class="history-panel" id="panel-progress">
    <div class="progress-lift-selector" id="liftSelector"></div>
    <div class="chart-container">
      <div class="chart-title" id="chartTitle">Select a lift</div>
      <canvas id="progressChart" height="200"></canvas>
      <div class="chart-empty" id="chartEmpty" style="display:none"></div>
    </div>
  </div>
</div>

<button class="save-btn" id="saveBtn" onclick="saveWorkout()">Save Workout</button>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('log')" id="tab-log">
    <span class="icon">📋</span>Log
  </button>
  <button class="tab-btn" onclick="switchTab('history')" id="tab-history">
    <span class="icon">📅</span>History
  </button>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────
const SUPABASE_URL = 'https://dsnpizvjwaransbuitqh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbnBpenZqd2FyYW5zYnVpdHFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjYzMzUsImV4cCI6MjA5OTA0MjMzNX0.Z3ceRThdf0ZUNzvfQhLUggo9T64mF5g05ND84WXFlgY';
const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Prefer': 'return=representation'
};

// Plate rack
const RACK = [45, 35, 25, 10, 5, 5, 5, 5, 2.5, 2.5];
const BAR_WEIGHT = 45;

// Barbell movements — drive the plate calculator
const BARBELL_KEYS = [
  'barbell bench','incline barbell','close-grip bench','floor press','board press',
  'overhead press','back squat','front squat','box squat','safety-bar squat',
  'deadlift','trap-bar','rack pull','barbell row','good morning'
];
function isBarbellLift(name) {
  const n = (name || '').toLowerCase();
  if (/\bdb\b|dumbbell/.test(n)) return false;
  return BARBELL_KEYS.some(k => n.includes(k));
}

// ── Program: Westside for Skinny Bastards, Part 3 (4-day) ─────────
// Each slot offers a rotating menu of exercise variations. The app
// remembers weights per *variation* (not per slot), so a lift you did
// three weeks ago is recalled the moment you pick it again.
const DAYS = {
  MEU: {
    label: 'ME Upper', full: 'Day 1 — Max-Effort Upper Body', badge: 'a',
    slots: [
      { slot: 'ME Press', type: 'Max Effort', target: 'Work up to 3–5RM', inputType: 'max_effort', sets: 5,
        options: ['Flat Barbell Bench','Incline Barbell Bench','Close-Grip Bench','Floor Press','2-Board Press','Weighted Dip','Flat DB Press','Incline DB Press'] },
      { slot: 'Supplemental Press', type: 'Supplemental', target: '3 × max reps', inputType: 'weight_reps', sets: 3,
        options: ['Flat DB Bench','Incline DB Bench','Dips','Push-Ups'] },
      { slot: 'Pull (Horizontal / Vertical)', type: 'Assistance', target: '4 × 8–12', inputType: 'weight_reps', sets: 4,
        options: ['Barbell Row','1-Arm DB Row','Chest-Supported Row','Seated Cable Row','Lat Pulldown','Pull-Ups'] },
      { slot: 'Rear Delts / Upper Back', type: 'Assistance', target: '3 × 12–15', inputType: 'weight_reps', sets: 3,
        options: ['Face Pulls','Rear Delt Flye','Band Pull-Apart'] },
      { slot: 'Biceps', type: 'Assistance', target: '3 × 8–12', inputType: 'weight_reps', sets: 3,
        options: ['Barbell Curl','DB Curl','Hammer Curl','Incline DB Curl'] },
    ]
  },
  DEL: {
    label: 'DE Lower', full: 'Day 2 — Dynamic-Effort Lower Body', badge: 'b',
    slots: [
      { slot: 'Jump Training', type: 'Dynamic Effort', target: '6 × 2–3 (explosive)', inputType: 'reps', sets: 6,
        options: ['Box Jump','Broad Jump','Squat Jump','Vertical Jump'] },
      { slot: 'Unilateral', type: 'Main', target: '3 × 8–12 / leg', inputType: 'weight_reps', sets: 3,
        options: ['Bulgarian Split Squat','Reverse Lunge','Walking Lunge','Step-Up'] },
      { slot: 'Hip Extension / Posterior', type: 'Assistance', target: '3 × 8–12', inputType: 'weight_reps', sets: 3,
        options: ['Romanian Deadlift','Glute-Ham Raise','Pull-Through','45° Back Raise','Good Morning'] },
      { slot: 'Weighted Abs', type: 'Core', target: '3–4 × 10–15', inputType: 'weight_reps', sets: 3,
        options: ['Hanging Leg Raise','Cable Crunch','Ab Wheel','Weighted Decline Sit-Up'] },
    ]
  },
  RU: {
    label: 'Rep Upper', full: 'Day 3 — Repetition Upper Body', badge: 'c',
    slots: [
      { slot: 'Repetition Press', type: 'Repetition', target: '3 × max reps · 60s rest', inputType: 'weight_reps', sets: 3,
        options: ['Flat DB Bench','Incline DB Bench','Push-Ups','Dips'] },
      { slot: 'Pull (Horizontal / Vertical)', type: 'Assistance', target: '3–4 × 8–12', inputType: 'weight_reps', sets: 4,
        options: ['1-Arm DB Row','Chest-Supported Row','Seated Cable Row','Lat Pulldown','Pull-Ups','Barbell Row'] },
      { slot: 'Medial / Rear Delts', type: 'Assistance', target: '3–4 × 8–15', inputType: 'weight_reps', sets: 3,
        options: ['Lateral Raise','Rear Delt Flye','Face Pulls'] },
      { slot: 'Traps / Upper Back', type: 'Assistance', target: '3–4 × 8–15', inputType: 'weight_reps', sets: 3,
        options: ['DB Shrug','Barbell Shrug','Power Shrug'] },
      { slot: 'Biceps', type: 'Assistance', target: '3–4 × 8–15', inputType: 'weight_reps', sets: 3,
        options: ['DB Curl','Barbell Curl','Hammer Curl','Incline DB Curl'] },
    ]
  },
  MEL: {
    label: 'ME Lower', full: 'Day 4 — Max-Effort Lower Body', badge: 'd',
    slots: [
      { slot: 'ME Squat / Deadlift', type: 'Max Effort', target: 'Work up to 5RM', inputType: 'max_effort', sets: 5,
        options: ['Box Squat','Back Squat','Front Squat','Safety-Bar Squat','Deadlift','Trap-Bar Deadlift','Rack Pull'] },
      { slot: 'Unilateral', type: 'Main', target: '3 × 8–12 / leg', inputType: 'weight_reps', sets: 3,
        options: ['Bulgarian Split Squat','Reverse Lunge','Walking Lunge','Step-Up'] },
      { slot: 'Hip Extension / Posterior', type: 'Assistance', target: '3 × 8–12', inputType: 'weight_reps', sets: 3,
        options: ['Romanian Deadlift','Glute-Ham Raise','Pull-Through','45° Back Raise','Good Morning'] },
      { slot: 'Weighted Abs', type: 'Core', target: '3–4 × 10–15', inputType: 'weight_reps', sets: 3,
        options: ['Hanging Leg Raise','Cable Crunch','Ab Wheel','Weighted Decline Sit-Up'] },
    ]
  }
};

// ── State ────────────────────────────────────────────────────────
let currentDay = 'MEU';
let logState = {};        // { slotKey: { sets:[...], note } }
let variationState = {};  // { slotKey: chosenVariation }
let editingId = null;
let historyCache = null;
let progressChart = null;
let selectedLift = null;

function slotKey(day, slot) { return day + '_' + slot.replace(/[^a-z0-9]/gi, '_'); }

function blankSetFor(inputType) {
  if (inputType === 'timed' || inputType === 'timed_per_side') return { duration: '', done: false };
  if (inputType === 'per_side' || inputType === 'reps') return { reps: '', done: false };
  return { weight: '', reps: '', done: false };
}

// ── Supabase ─────────────────────────────────────────────────────
async function dbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: HEADERS, ...options });
  if (!res.ok) { const err = await res.text(); throw new Error(err); }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function getHistory(force = false) {
  if (historyCache && !force) return historyCache;
  try {
    historyCache = await dbFetch('workouts?order=created_at.desc');
    return historyCache;
  } catch(e) { console.error('Failed to load history', e); return []; }
}

// Most recent logged session of a given exercise variation (across any day)
function findLastForName(history, name) {
  for (const entry of history) {
    if (editingId && entry.id === editingId) continue;
    const ex = (entry.exercises || []).find(e => e.name === name);
    if (ex) return { ex, date: entry.created_at };
  }
  return null;
}

// ── Plate Calculator ─────────────────────────────────────────────
function calcPlates(totalWeight) {
  const perSide = (totalWeight - BAR_WEIGHT) / 2;
  if (perSide <= 0) return [];
  let remaining = perSide;
  const used = [];
  const available = [...RACK].sort((a,b) => b - a);
  for (const plate of available) {
    if (remaining <= 0) break;
    if (plate <= remaining + 0.01) {
      used.push(plate);
      remaining -= plate;
      remaining = Math.round(remaining * 100) / 100;
    }
  }
  return used;
}

function renderPlates(plates) {
  if (!plates.length) return `<span class="plate-none">Bar only</span>`;
  const colorClass = { 45:'p45', 35:'p35', 25:'p25', 10:'p10', 5:'p5', 2.5:'p2h' };
  return plates.map(p => `<div class="plate-chip ${colorClass[p] || ''}">${p}</div>`).join('');
}

// ── State helpers ─────────────────────────────────────────────────
function getState(key, sets, inputType) {
  if (!logState[key]) {
    logState[key] = { sets: Array.from({length: sets}, () => ({...blankSetFor(inputType)})), note: '' };
  }
  return logState[key];
}

// ── Render Exercises ──────────────────────────────────────────────
async function renderExercises() {
  const area = document.getElementById('exerciseArea');
  area.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.85rem;">Loading…</div>';
  const history = await getHistory();
  area.innerHTML = '';

  const day = DAYS[currentDay];
  day.slots.forEach(cfg => {
    const key = slotKey(currentDay, cfg.slot);
    const inputType = cfg.inputType || 'weight_reps';
    if (!variationState[key]) variationState[key] = cfg.options[0];
    const variation = variationState[key];
    const state = getState(key, cfg.sets, inputType);

    const lastInfo = findLastForName(history, variation);
    const last = lastInfo ? lastInfo.ex : null;
    const dateStr = lastInfo ? new Date(lastInfo.date).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';

    // Variation dropdown (only when there's a real choice)
    let dropdown = '';
    if (cfg.options.length > 1) {
      dropdown = `<div class="variation-wrap"><select class="variation-select" onchange="selectVariation('${key}', this.value)">`
        + cfg.options.map(o => `<option ${o === variation ? 'selected' : ''}>${o}</option>`).join('')
        + `</select></div>`;
    }

    // Max-effort top-set hint
    let meHint = '';
    if (inputType === 'max_effort' && last) {
      const wsets = last.sets.filter(s => s.weight).map(s => ({ w: parseFloat(s.weight), r: s.reps }));
      if (wsets.length) {
        const top = wsets.reduce((a,b) => b.w > a.w ? b : a);
        meHint = `<div class="suggestion-bar"><div class="suggestion-text">Last top set → <span>${top.w} lb × ${top.r || '?'}</span></div></div>`;
      }
    }

    // Last-session recall hint
    let lastHint = '';
    if (last) {
      let summary = '';
      if (inputType === 'reps') summary = last.sets.filter(s => s.reps).map(s => `${s.reps}`).join(', ');
      else if (inputType === 'timed' || inputType === 'timed_per_side') summary = last.sets.filter(s => s.duration).map(s => `${s.duration}s`).join(', ');
      else if (inputType === 'per_side') summary = last.sets.filter(s => s.reps).map(s => `${s.reps}/side`).join(', ');
      else summary = last.sets.filter(s => s.weight).map(s => `${s.weight}×${s.reps || '?'}`).join(', ');
      if (summary) lastHint = `<div class="last-session">Last ${dateStr}: ${summary}</div>`;
    }

    // Plate calculator (barbell movements)
    let plateSection = '';
    if (isBarbellLift(variation)) {
      const weights = last ? last.sets.filter(s => s.weight).map(s => parseFloat(s.weight)) : [];
      const baseW = weights.length ? Math.max(...weights) : 0;
      plateSection = `<div class="plate-calc">
        <div class="plate-calc-label">Plates per side${baseW > 0 ? ` · last ${baseW}lb` : ''}</div>
        <div class="plate-chips">${baseW > 0 ? renderPlates(calcPlates(baseW)) : '<span class="plate-none">Enter a weight</span>'}</div>
      </div>`;
    }

    const setsHTML = buildSetRows(key, inputType, state, last);

    const card = document.createElement('div');
    card.className = 'ex-card';
    card.id = `excard-${key}`;
    card.innerHTML = `
      <div class="ex-card-header">
        <div><div class="ex-card-name">${dropdown ? cfg.slot : variation}</div><div class="ex-card-type">${cfg.type}</div></div>
        <div class="ex-target">${cfg.target}</div>
      </div>
      ${dropdown}
      ${meHint}
      ${lastHint}
      ${plateSection}
      ${setsHTML}
      <textarea class="notes-area" placeholder="Notes…" onchange="updateNote('${key}', this.value)">${state.note}</textarea>
    `;
    area.appendChild(card);
  });
}

function buildSetRows(key, inputType, state, last) {
  const check = (s, i) => `<button class="set-check ${s.done ? 'done' : ''}" onclick="toggleDone('${key}', ${i}, this)">${s.done ? '✓' : ''}</button>`;
  let labels = '', rows = '';

  if (inputType === 'reps') {
    labels = `<div class="set-labels"><div class="set-label"></div><div class="set-label" style="grid-column:span 2">Reps</div><div class="set-label"></div></div>`;
    state.sets.forEach((s, i) => {
      const ph = last?.sets[i]?.reps || 'reps';
      rows += `<div class="set-row"><div class="set-num">${i+1}</div>
        <input class="set-input" type="number" inputmode="numeric" placeholder="${ph}" value="${s.reps || ''}" onchange="updateSet('${key}', ${i}, 'reps', this.value)" style="grid-column:span 2" />
        ${check(s, i)}</div>`;
    });
  } else if (inputType === 'timed' || inputType === 'timed_per_side') {
    const lbl = inputType === 'timed_per_side' ? 'Duration/side (sec)' : 'Duration (sec)';
    labels = `<div class="set-labels"><div class="set-label"></div><div class="set-label" style="grid-column:span 2">${lbl}</div><div class="set-label"></div></div>`;
    state.sets.forEach((s, i) => {
      const ph = last?.sets[i]?.duration || 'sec';
      rows += `<div class="set-row"><div class="set-num">${i+1}</div>
        <input class="set-input" type="number" inputmode="numeric" placeholder="${ph}" value="${s.duration || ''}" onchange="updateSet('${key}', ${i}, 'duration', this.value)" style="grid-column:span 2" />
        ${check(s, i)}</div>`;
    });
  } else if (inputType === 'per_side') {
    labels = `<div class="set-labels"><div class="set-label"></div><div class="set-label" style="grid-column:span 2">Reps / side</div><div class="set-label"></div></div>`;
    state.sets.forEach((s, i) => {
      const ph = last?.sets[i]?.reps || 'reps';
      rows += `<div class="set-row"><div class="set-num">${i+1}</div>
        <input class="set-input" type="number" inputmode="numeric" placeholder="${ph}" value="${s.reps || ''}" onchange="updateSet('${key}', ${i}, 'reps', this.value)" style="grid-column:span 2" />
        ${check(s, i)}</div>`;
    });
  } else {
    // weight_reps / max_effort
    labels = `<div class="set-labels"><div class="set-label"></div><div class="set-label">Weight (lb)</div><div class="set-label">Reps</div><div class="set-label"></div></div>`;
    state.sets.forEach((s, i) => {
      const wph = last?.sets[i]?.weight || 'lbs';
      const rph = last?.sets[i]?.reps || 'reps';
      rows += `<div class="set-row"><div class="set-num">${i+1}</div>
        <input class="set-input" type="number" inputmode="decimal" placeholder="${wph}" value="${s.weight || ''}" onchange="updateSet('${key}', ${i}, 'weight', this.value);updatePlateDisplay('${key}')" />
        <input class="set-input" type="number" inputmode="numeric" placeholder="${rph}" value="${s.reps || ''}" onchange="updateSet('${key}', ${i}, 'reps', this.value)" />
        ${check(s, i)}</div>`;
    });
  }

  return `<div class="set-rows">${labels}${rows}</div><button class="add-set-btn" onclick="addSet('${key}', '${inputType}')">+ Add Set</button>`;
}

function updatePlateDisplay(key) {
  const card = document.getElementById(`excard-${key}`);
  if (!card) return;
  const plateChips = card.querySelector('.plate-chips');
  if (!plateChips) return;
  const inputs = card.querySelectorAll('.set-input');
  let w = 0;
  for (const inp of inputs) { if (inp.value) { w = parseFloat(inp.value); break; } }
  if (w > 0) plateChips.innerHTML = renderPlates(calcPlates(w));
}

function selectVariation(key, value) {
  variationState[key] = value;
  renderExercises();
}

function updateSet(key, idx, field, val) { logState[key].sets[idx][field] = val; }
function updateNote(key, val) { logState[key].note = val; }

function toggleDone(key, idx, btn) {
  logState[key].sets[idx].done = !logState[key].sets[idx].done;
  btn.classList.toggle('done');
  btn.textContent = logState[key].sets[idx].done ? '✓' : '';
}

function addSet(key, inputType) {
  logState[key].sets.push({...blankSetFor(inputType)});
  renderExercises();
}

// ── Day selection ─────────────────────────────────────────────────
function selectDay(day) {
  currentDay = day;
  document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById(`pill-${day}`);
  if (pill) pill.classList.add('active');
  document.getElementById('dayFull').textContent = DAYS[day].full;
  document.getElementById('saveBtn').style.display = 'block';
  renderExercises();
}

// ── Save / Edit ───────────────────────────────────────────────────
async function saveWorkout() {
  const day = DAYS[currentDay];
  const saved = [];
  day.slots.forEach(cfg => {
    const key = slotKey(currentDay, cfg.slot);
    const state = logState[key];
    if (!state) return;
    if (!state.sets.some(s => s.weight || s.reps || s.duration)) return;
    saved.push({ slot: cfg.slot, type: cfg.type, name: variationState[key] || cfg.options[0], sets: state.sets, note: state.note });
  });
  if (!saved.length) { showToast('Log at least one set first'); return; }

  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;

  try {
    if (editingId) {
      await dbFetch(`workouts?id=eq.${editingId}`, {
        method: 'PATCH',
        body: JSON.stringify({ day: currentDay, week: null, exercises: saved })
      });
      editingId = null;
      showToast('Workout updated ✓');
    } else {
      await dbFetch('workouts', {
        method: 'POST',
        body: JSON.stringify({ day: currentDay, week: null, exercises: saved })
      });
      showToast('Workout saved ✓');
    }
    historyCache = null;
  } catch(e) {
    showToast('Save failed — check connection'); console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Workout';
  }
  logState = {}; renderExercises();
}

async function loadForEdit(id) {
  const history = await getHistory();
  const entry = history.find(e => e.id === id);
  if (!entry) return;
  if (!DAYS[entry.day]) { showToast('Old-program entry — view only'); return; }

  editingId = id;
  currentDay = entry.day;
  logState = {};
  entry.exercises.forEach(ex => {
    const slot = ex.slot || ex.name;
    const key = slotKey(currentDay, slot);
    variationState[key] = ex.name;
    logState[key] = { sets: ex.sets.map(s => ({...s})), note: ex.note || '' };
  });
  switchTab('log');
  document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById(`pill-${currentDay}`);
  if (pill) pill.classList.add('active');
  document.getElementById('dayFull').textContent = DAYS[currentDay].full;
  renderExercises();
  document.getElementById('saveBtn').textContent = 'Update Workout';
  showToast('Loaded for editing');
}

// ── History ───────────────────────────────────────────────────────
let historyTabActive = 'log';

function switchHistoryTab(tab) {
  historyTabActive = tab;
  document.querySelectorAll('.history-tab').forEach((t,i) => {
    t.classList.toggle('active', (i === 0 && tab === 'log') || (i === 1 && tab === 'progress'));
  });
  document.getElementById('panel-log').classList.toggle('active', tab === 'log');
  document.getElementById('panel-progress').classList.toggle('active', tab === 'progress');
  if (tab === 'progress') renderProgress();
}

function dayMeta(entry) {
  if (DAYS[entry.day]) return { label: DAYS[entry.day].label, badge: DAYS[entry.day].badge };
  const letter = (entry.day || '?').toString().toLowerCase();
  return { label: `Day ${entry.day}`, badge: ['a','b','c','d'].includes(letter) ? letter : 'a' };
}

async function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = `<div class="history-empty"><div class="icon">⏳</div>Loading…</div>`;
  const history = await getHistory(true);

  if (!history.length) {
    list.innerHTML = `<div class="history-empty"><div class="icon">📭</div>No workouts logged yet.</div>`;
    return;
  }

  list.innerHTML = history.map((entry, idx) => {
    const meta = dayMeta(entry);
    const dateStr = new Date(entry.created_at).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

    const exHTML = (entry.exercises || []).map(ex => {
      const setsHTML = (ex.sets || []).map((s,i) => {
        let label = '';
        if (s.duration) label = `${s.duration}s`;
        else if (s.weight) label = `${s.weight}lb${s.reps ? ` × ${s.reps}` : ''}`;
        else if (s.reps) label = `${s.reps}`;
        if (!label) return '';
        return `<div class="history-set-chip ${s.done ? 'done' : ''}">${i+1}. ${label}</div>`;
      }).join('');
      const slotTag = ex.slot && ex.slot !== ex.name ? ` <span class="history-ex-slot">· ${ex.slot}</span>` : '';
      return `<div class="history-ex">
        <div class="history-ex-name">${ex.name}${slotTag}</div>
        <div class="history-sets">${setsHTML}</div>
        ${ex.note ? `<div class="history-note">${ex.note}</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="history-entry">
      <div class="history-entry-header" onclick="toggleHistory(${idx}, this)">
        <div><div class="history-date">${dateStr}</div></div>
        <div class="history-day-badge badge-${meta.badge}">${meta.label}</div>
      </div>
      <div class="history-body" id="hbody-${idx}">
        ${exHTML}
        <div class="history-actions">
          <button class="edit-btn" onclick="loadForEdit('${entry.id}')">✎ Edit</button>
          <button class="delete-btn" onclick="deleteEntry('${entry.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleHistory(idx, header) {
  document.getElementById(`hbody-${idx}`).classList.toggle('open');
  header.classList.toggle('open');
}

async function deleteEntry(id) {
  try {
    await dbFetch(`workouts?id=eq.${id}`, { method: 'DELETE' });
    historyCache = null;
    renderHistory();
  } catch(e) { showToast('Delete failed'); }
}

// ── Progress Charts ───────────────────────────────────────────────
function chartLifts(history) {
  const s = new Set();
  history.forEach(e => (e.exercises || []).forEach(ex => {
    if ((ex.sets || []).some(x => x.weight)) s.add(ex.name);
  }));
  return [...s].sort();
}

async function renderProgress() {
  const history = await getHistory();
  const lifts = chartLifts(history);
  const sel = document.getElementById('liftSelector');
  const canvas = document.getElementById('progressChart');
  const empty = document.getElementById('chartEmpty');

  if (!lifts.length) {
    sel.innerHTML = '';
    document.getElementById('chartTitle').textContent = 'No data yet';
    canvas.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = 'Log some weighted lifts to see progress.';
    return;
  }

  if (selectedLift === null || !lifts.includes(selectedLift)) selectedLift = lifts[0];
  sel.innerHTML = lifts.map(l =>
    `<div class="lift-pill ${l === selectedLift ? 'active' : ''}" onclick="selectLift('${l}')">${l}</div>`
  ).join('');
  drawChart(history);
}

function selectLift(lift) {
  selectedLift = lift;
  document.querySelectorAll('.lift-pill').forEach(p => {
    p.classList.toggle('active', p.textContent === lift);
  });
  getHistory().then(h => drawChart(h));
}

function drawChart(history) {
  const title = document.getElementById('chartTitle');
  const empty = document.getElementById('chartEmpty');
  const canvas = document.getElementById('progressChart');

  title.textContent = selectedLift;

  // Top weight per session for the selected lift
  const points = [];
  [...history].reverse().forEach(entry => {
    const ex = (entry.exercises || []).find(e => e.name === selectedLift);
    if (!ex) return;
    const weights = (ex.sets || []).filter(s => s.weight).map(s => parseFloat(s.weight));
    if (!weights.length) return;
    points.push({
      date: new Date(entry.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric' }),
      weight: Math.max(...weights)
    });
  });

  if (!points.length) {
    canvas.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = 'No data yet for this lift.';
    return;
  }

  canvas.style.display = 'block';
  empty.style.display = 'none';

  if (progressChart) progressChart.destroy();

  progressChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: points.map(p => p.date),
      datasets: [{
        label: 'Top Weight (lb)',
        data: points.map(p => p.weight),
        borderColor: '#e8f542',
        backgroundColor: 'rgba(232,245,66,0.08)',
        borderWidth: 2,
        pointBackgroundColor: '#e8f542',
        pointRadius: 4,
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c1c1c',
          titleColor: '#e8f542',
          bodyColor: '#f0f0f0',
          borderColor: '#252525',
          borderWidth: 1
        }
      },
      scales: {
        x: { ticks: { color: '#666', font: { size: 11 } }, grid: { color: '#1a1a1a' } },
        y: { ticks: { color: '#666', font: { size: 11 } }, grid: { color: '#1a1a1a' } }
      }
    }
  });
}

// ── Tab Switching ─────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`screen-${tab}`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById('saveBtn').style.display = tab === 'log' ? 'block' : 'none';
  if (tab === 'history') renderHistory();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ──────────────────────────────────────────────────────────
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
selectDay('MEU');

// Register service worker for PWA caching
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      });
  });
}
</script>
